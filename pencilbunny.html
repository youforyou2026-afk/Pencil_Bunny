<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>연필토끼</title>
  <link rel="stylesheet" href="common.css">
  <style>

  /* 기본 시스템 폰트 설정 (외부 다운로드 없음) */
  body, .content-item h2, .content-item h1 a {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable", "Pretendard", "Malgun Gothic", "맑은 고딕", sans-serif;
  }

  /* 설명글 (h2) 스타일 */
  .content-item h2 {
    font-size: 1.30rem;
    font-weight: 400;      /* 기본 두께로 부드럽게 표시 */
    color: #333;
    line-height: 1.6;      /* 줄간격을 넓혀 가독성 향상 */
    letter-spacing: -0.3px; /* 자간을 살짝 좁혀 정돈된 느낌 제공 */
  }

  /* 다운로드 링크 (h1 a) 스타일 */
  .content-item h1 a {
    font-size: 1.50rem;
    font-weight: 700;      /* 강조 두께 */
    color: #5d4a75;        /* 패널과 어울리는 딥 퍼플 */
    text-decoration: none;
    border-bottom: 2px solid #5d4a75; /* 깔끔한 밑줄 디자인 */
    padding-bottom: 3px;
  }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      margin: 0; 
      padding: 0px; 
      display: flex; 
      flex-direction: column; 
      align-items: center;    
      text-align: center;     
      font-family: sans-serif; 
    }
    
    /* 메뉴 영역 */
    .menu-container { width: 100%; height: 60px; border: none; }

    /* 전체 콘텐츠를 감싸는 반투명 라운드 패널 */
    .panel {
      background-color: rgba(180, 170, 200, 0.5); /* #c8bed8 색상 + 50% 반투명 */
      backdrop-filter: blur(10px);               /* 뒤 배경 흐림 효과 */
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;                       /* 모서리 라운딩 */
      border: 1px solid rgba(255, 255, 255, 0.4); /* 미세한 흰색 테두리 */
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);  /*은은한 그림자 */
      padding: 30px 20px;                        /* 패널 안쪽 여백 */
      margin: 20px auto 40px auto;               /* 외부 간격 및 중앙 정렬 */
      width: 90%;
      max-width: 1150px;                          /* 패널의 최대 너비 */
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    /* 각 요소 사이의 간격 설정 */
    .content-item { margin-bottom: 20px; }
    
    /* 모바일 반응형 */
    @media (max-width: 600px) {
      .panel {
        width: 92%;
        padding: 20px 15px; /* 모바일에서는 패널 내부 여백 축소 */
      }
      .main-image {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
  <div class="bg-glow-3"></div>
  
  <!-- 1. 최상단 menu.html (상단 고정/메인 영역 밖) -->
  <object class="content-item menu-container" type="text/html" data="menu.html"></object>
  
  <!-- 반투명 라운드 패널 시작 -->
  <div class="panel">
    
  <img src="title.png" alt="타이틀" class="center-title">
    
    <!-- 텍스트 -->
    <div class="content-item">
      <h2>무료 라이브 배경화면 입니다.</h2>
      <h2>다운로드하여 스마트폰 배경화면으로 지정하여 쓰세요.</h2>
      <h2>예시 이미지로 스마트폰에서 어떨지 참고하세요.</h2>
      <h2>라이브 배경화면을 하시고 싶은분은 밑에 구글 드라이브 링크에서 다운로드 하세요.(mp4파일입니다)</h2>
    </div>
  </div>
</body>
</html>
