<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>연필토끼</title>
  <link rel="stylesheet" href="common.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      /* 상단 고정 메뉴 높이(60px) + 여백(20px) 확보 */
      padding-top: 80px;
      padding-bottom: 40px;
      padding-left: 20px;
      padding-right: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: sans-serif;
    }
    /* 상단 메뉴 iframe 고정 스타일 */
    .menu-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      border: none;
      z-index: 1000;
      background-color: transparent;
    }
    /* 전체 컨테이너 (3열 레이아웃) */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 900px;
      width: 100%;
    }
    /* 개별 반투명 패널 (카드) */
    .card {
      background-color: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
    }
    .card img {
      width: 100%;
      aspect-ratio: 9 / 16; /* 9:16 비율 적용 */
      object-fit: cover;
      border-radius: 10px;
    }
/* 모바일 반응형 (600px 이하 스마트폰 화면) */
@media (max-width: 300px) {
  .gallery-grid {
    grid-template-columns: repeat(1, 1fr);
  }

  /* 스마트폰에서만 특정 이미지 크기를 60%로 축소 */
  .card img.small-img-mobile {
    width: 40%;
    margin: 0 auto; /* 중앙 정렬 */
  }
}
  </style>
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
  <div class="bg-glow-3"></div>

  <!-- 상단 메뉴 프레임 -->
  <iframe src="menu.html" class="menu-frame"></iframe>

  <!-- 전체 그리드 컨테이너 -->
  <div class="gallery-grid">
    <div class="card" onclick="location.href='profile/profile_image1.html'">
      <img src="https://lh3.googleusercontent.com/d/1e-El6Kct7eUlVrX1t4tPpCcXBuKxgXrs" alt="이미지 1">
    </div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 2"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 3"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 4"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 5"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 6"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 7"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 8"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 9"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 10"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 11"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 12"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 13"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 14"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 15"></div>
  </div>
</body>
</html>
