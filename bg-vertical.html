<!DOCTYPE html>

  <link rel="stylesheet" href="common.css">

  <style>
    /* =========================
       기본 설정
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      padding-top: 80px;
      padding-bottom: 40px;
      padding-left: 20px;
      padding-right: 20px;

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      font-family: sans-serif;
    }


    /* =========================
       상단 메뉴
    ========================= */

    .menu-frame {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 60px;

      border: none;

      z-index: 1000;

      background-color: transparent;
    }


    /* =========================
       갤러리 전체
    ========================= */

    .gallery-grid {
      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 20px;

      max-width: 900px;

      width: 100%;
    }


    /* =========================
       카드
    ========================= */

    .card {
      position: relative;

      width: 100%;

      background-color: rgba(255, 255, 255, 0.4);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      border-radius: 16px;

      padding: 12px;

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.08);

      border: 1px solid rgba(255, 255, 255, 0.4);

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }


    /* =========================
       카드 마우스 효과
    ========================= */

    .card:hover {
      transform: translateY(-4px);

      box-shadow:
        0 12px 24px rgba(0, 0, 0, 0.12);
    }


    /* =========================
       일반 이미지
    ========================= */

    .card img {
      display: block;

      width: 100%;

      aspect-ratio: 9 / 16;

      object-fit: cover;

      border-radius: 10px;
    }


    /* =========================
       MP4 영상
    ========================= */

    .card-video {
      display: block;

      width: 100%;

      aspect-ratio: 9 / 16;

      object-fit: cover;

      border-radius: 10px;

      background-color: #eeeeee;
    }


    /* =========================
       모바일
    ========================= */

    @media (max-width: 600px) {

      body {
        padding-left: 10px;
        padding-right: 10px;
        padding-top: 75px;
      }

      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);

        gap: 10px;
      }

      .card {
        padding: 8px;

        border-radius: 12px;
      }

      .card-video {
        border-radius: 8px;
      }

      .card img {
        border-radius: 8px;
      }
    }


    /* =========================
       아주 작은 스마트폰
    ========================= */

    @media (max-width: 380px) {

      .gallery-grid {
        gap: 8px;
      }

      .card {
        padding: 6px;
      }
    }

  </style>
</head>

  ====================================== -->

  <script>

    document.addEventListener("DOMContentLoaded", function () {

      const videos = document.querySelectorAll("video");

      videos.forEach(function (video) {

        /*
         * 모바일 브라우저에서
         * 자동재생을 허용받기 위한 설정
         */

        video.muted = true;
        video.setAttribute("muted", "");
        video.setAttribute("playsinline", "");

        /*
         * 영상 재생 시도
         */

        const playPromise = video.play();

        if (playPromise !== undefined) {

          playPromise.catch(function (error) {

            console.log(
              "자동재생이 차단되었습니다:",
              error
            );

          });

        }

      });

    });
