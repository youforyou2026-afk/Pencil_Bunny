<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>연필토끼</title>
  <link rel="stylesheet" href="common.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      padding-top: 80px;
      padding-bottom: 40px;
      padding-left: 20px;
      padding-right: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: sans-serif;
    }
    .menu-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      border: none;
      z-index: 1000;
      background-color: transparent;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 900px;
      width: 100%;
    }
    .card {
      background-color: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
    }
    .card img, .card video {
      width: 100%;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      border-radius: 10px;
    }
    @media (max-width: 600px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
  <div class="bg-glow-3"></div>

  <iframe src="menu.html" class="menu-frame"></iframe>

  <div class="gallery-grid">
    <!-- 비디오 카드 -->
    <div class="card" onclick="location.href='profile/profile_image1.html'">
      <video 
        poster="https://lh3.googleusercontent.com/d/1XkfsUYjfByxeGMRvFTKi9OS0mCz8CvK2" 
        autoplay 
        loop 
        muted 
        playsinline 
        controls
        class="card-video">
        <!-- Google Drive 링크 대신 직접 접근 가능한 mp4 파일 URL을 넣어야 합니다 -->
        <source src="https://drive.google.com/uc?export=download&id=1_Eyh3nkZXQN1fUj4Aesc4ztJIfTwmhXL" type="video/mp4">
        <img src="https://lh3.googleusercontent.com/d/1XkfsUYjfByxeGMRvFTKi9OS0mCz8CvK2" alt="대체 이미지">
      </video>
    </div>

    <!-- 이미지 카드들 -->
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 2"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 3"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 4"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 5"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 6"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 7"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 8"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 9"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 10"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 11"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 12"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 13"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 14"></div>
    <div class="card"><img src="https://via.placeholder.com/300x533" alt="이미지 15"></div>
  </div>
</body>
</html>
