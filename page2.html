<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유튜브 비디오 페이지</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }
    iframe {
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <iframe 
    width="560" 
    height="315" 
    src="https://www.youtube.com/embed/-BeQUh_oZ8s" 
    title="YouTube video player" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
    allowfullscreen>
  </iframe>

</body>
</html>
