<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 기기 반응형 지원을 위한 필수 메타 태그 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유튜브 비디오 페이지</title>
  <style>
    body {
      display: flex;
      flex-direction: column; /* 위에서 아래로 배치 */
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
      padding: 20px 0;
      box-sizing: border-box;
    }

    /* index.html 기준 타이틀 이미지 스타일 */
    .title {
      margin-bottom: 30px;
      text-align: center;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .title img {
      width: 90%; /* PC에서는 화면 비율에 맞게 크고, 모바일에서는 자동 조정 */
      max-width: 1500px;
      height: auto;
      border-radius: 10px;
    }

    /* 비디오 컨테이너 (최대 너비 제한 및 16:9 비율 유지) */
    .video-container {
      position: relative;
      width: 90%;
      max-width: 1500px; /* 타이틀 이미지의 최대 너비와 일치 */
      aspect-ratio: 16 / 9; /* 16:9 화면 비율 유지 */
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      overflow: hidden;
      background-color: #000;
    }

    /* iframe이 컨테이너 크기에 100% 맞게 채워지도록 설정 */
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ==========================================
       스마트폰 (모바일) 반응형 스타일
       ========================================== */
    @media (max-width: 768px) {
      body {
        padding: 15px 0;
      }

      .title {
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 타이틀 이미지 (index.html과 동일한 구조) -->
  <div class="title">
    <img src="https://lh3.googleusercontent.com/d/1I8zeD77UOtS23hnMKx9zIaR1t-ASvSgL" alt="타이틀 이미지">
  </div>

  <!-- 유튜브 영상 -->
  <div class="video-container">
    <iframe 
      src="https://www.youtube.com/embed/-BeQUh_oZ8s" 
      title="YouTube video player" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
