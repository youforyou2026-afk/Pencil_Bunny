<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지 갤러리</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: sans-serif;
    }

    /* 전체 컨테이너 (3열 레이아웃) */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 900px;
      width: 100%;
    }

    /* 개별 반투명 패널 (카드) */
    .card {
      background-color: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
    }

    /* 모바일 반응형 */
    @media (max-width: 600px) {
      .gallery-grid {
        grid-template-columns: repeat(1, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
  <div class="bg-glow-3"></div>

  <!-- 전체 그리드 컨테이너 -->
  <div class="gallery-grid">
    <!-- 클릭 시 location.href를 통해 해당 페이지로 직접 이동 -->
    <div class="card" onclick="location.href='profile/profile_image1.html'">
      <img src="profile/profile_image1.html" alt="이미지 1">
    </div>
    
    <div class="card"><img src="https://via.placeholder.com/300" alt="이미지 2"></div>
    <div class="card"><img src="https://via.placeholder.com/300" alt="이미지 3"></div>
    <div class="card"><img src="https://via.placeholder.com/300" alt="이미지 4"></div>
    <div class="card"><img src="https://via.placeholder.com/300" alt="이미지 5"></div>
    <div class="card"><img src="https://via.placeholder.com/300" alt="이미지 6"></div>
    <div class="card"><img src="https://via.placeholder.com/300" alt="이미지 7"></div>
    <div class="card"><img src="https://via.placeholder.com/300" alt="이미지 8"></div>
    <div class="card"><img src="https://via.placeholder.com/300" alt="이미지 9"></div>
    <div class="card"><img src="https://via.placeholder.com/300" alt="이미지 10"></div>
    <div class="card"><img src="https://via.placeholder.com/300" alt="이미지 11"></div>
    <div class="card"><img src="https://via.placeholder.com/300" alt="이미지 12"></div>
    <div class="card"><img src="https://via.placeholder.com/300" alt="이미지 13"></div>
    <div class="card"><img src="https://via.placeholder.com/300" alt="이미지 14"></div>
    <div class="card"><img src="https://via.placeholder.com/300" alt="이미지 15"></div>
  </div>

</body>
</html>
