<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 모바일 기기 반응형 지원을 위한 필수 메타 태그 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2x2 이미지 레이아웃</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 75vh;
      margin: 0;
      background-color: #f0f0f0;
    }
    .title {
      margin-bottom: 30px;
      text-align: center;
    }
    .title img {
      width: 90%; /* PC에서는 크게, 모바일에서는 자동 줄어듦 */
      max-width: 1500px;
      height: auto;
      border-radius: 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto;
      gap: 30px;
    }
    .grid img {
      width: 100%;
      max-width: 300px;
      height: auto;
      aspect-ratio: 1 / 1; /* 정사각형 유지 */
      object-fit: cover;
      border: 2px solid #ccc;
      border-radius: 10px;
    }

/* ==========================================
   스마트폰 (모바일) 반응형 스타일
   ========================================== */
@media (max-width: 768px) {
  body {
    justify-content: flex-start;
    padding: 15px;
  }

  .title {
    margin-bottom: 20px;
  }

  .grid {
    grid-template-columns: repeat(2, 1fr); /* 모바일에서도 2x2 유지 원할 경우 */
    gap: 15px; /* 모바일 간격 축소 */
  }

  .grid img {
    width: 100%; /* 모바일 화면 폭에 맞게 자동 조절 */
    max-width: 160px;
    height: 160px;
  }
}

/* 화면이 매우 작은 모바일 (1열로 변경 원할 경우) */
@media (max-width: 480px) {
  .grid {
    grid-template-columns: 1fr; /* 화면이 작아지면 1열로 세로 배치 */
  }
  
  .grid img {
    max-width: 280px;
    height: 280px;
  }
}
</style>
</head>
<body>

<!-- 타이틀 이미지 -->
<div class="title">
  <img src="title.jpg" alt="타이틀 이미지">
</div>

<!-- 이미지 그리드 -->
<div class="grid">
  <a href="page1.html">
    <img src="page1.jpg" alt="이미지 1">
  </a>
  <a href="page2.html">
    <img src="page2.jpg" alt="이미지 2">
  </a>
  <a href="page3.html">
    <img src="https://github.com/youforyou2026-afk/Pencil_Bunny/blob/235d301eda7b8b9a19b0ea0117cd8c219574517b/rrr.jpg?raw=true" alt="이미지 3">
  </a>
  <a href="page4.html">
    <img src="https://github.com/youforyou2026-afk/Pencil_Bunny/blob/235d301eda7b8b9a19b0ea0117cd8c219574517b/rrr.jpg?raw=true" alt="이미지 4">
  </a>
</div>

</body>
</html>
