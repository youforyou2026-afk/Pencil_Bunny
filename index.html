<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2x2 이미지 레이아웃</title>
  <style>
    body {
      display: flex;
      flex-direction: column; /* 세로 방향으로 배치 */
      justify-content: center;
      align-items: center;
      height: 0vh;
      margin: 0;
      background-color: #f0f0f0;
    }
    .title {
      margin-bottom: 30px; /* 타이틀과 그리드 사이 간격 */
    }
    .title img {
      width: 1000px; /* 타이틀 이미지 크기 (원하는 대로 수정 가능) */
      height: auto;
      border-radius: 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 20px; /* 이미지 사이 간격 */
    }
    .grid img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border: 2px solid #ccc;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <!-- 타이틀 이미지 -->
  <div class="title">
    <img src="https://github.com/youforyou2026-afk/Pencil_Bunny/blob/main/title.jpg?raw=true" alt="타이틀 이미지">
  </div>

  <!-- 2x2 이미지 그리드 -->
  <div class="grid">
    <img src="https://github.com/youforyou2026-afk/Pencil_Bunny/blob/235d301eda7b8b9a19b0ea0117cd8c219574517b/rrr.jpg?raw=true" alt="이미지 1">
    <img src="https://github.com/youforyou2026-afk/Pencil_Bunny/blob/235d301eda7b8b9a19b0ea0117cd8c219574517b/rrr.jpg?raw=true" alt="이미지 2">
    <img src="https://github.com/youforyou2026-afk/Pencil_Bunny/blob/235d301eda7b8b9a19b0ea0117cd8c219574517b/rrr.jpg?raw=true" alt="이미지 3">
    <img src="https://github.com/youforyou2026-afk/Pencil_Bunny/blob/235d301eda7b8b9a19b0ea0117cd8c219574517b/rrr.jpg?raw=true" alt="이미지 4">
  </div>
</body>
</html>
