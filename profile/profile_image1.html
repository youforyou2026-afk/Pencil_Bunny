<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중앙 정렬 레이아웃</title>
  <link rel="stylesheet" href="../common.css">
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
    body {
      margin: 0;
      padding: 0px;
      display: flex;
      flex-direction: column; /* 요소들을 세로로 배치 */
      align-items: center;    /* 가로 방향 중앙 정렬 */
      text-align: center;     /* 텍스트 중앙 정렬 */
      font-family: sans-serif;
    }

    /* 각 요소 사이의 간격 설정 */
    .content-item {
      margin-bottom: 20px;
    }

    /* 메뉴 영역 (menu.html 불러오기) */
    .menu-container {
      width: 100%;
      height: 60px; /* menu.html의 높이에 맞게 조절하세요 */
      border: none;
    }

    /* 이미지 크기 조절 */
    .main-image {
      max-width: 50%;
      height: auto;
    }

    /* 이미지 버튼 스타일링 */
    .img-button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .img-button img {
      display: block;
      max-width: 200px; /* 버튼 이미지 크기에 맞춰 조절하세요 */
      height: auto;
    }

      /* 비디오 컨테이너 (최대 너비 제한 및 16:9 비율 유지) */
    .video-container {
      position: relative;
      width: 90%;
      max-width: 1500px; /* 타이틀 이미지의 최대 너비와 일치 */
      aspect-ratio: 16 / 9; /* 16:9 화면 비율 유지 */
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      overflow: hidden;
      background-color: #000;
    }

    /* iframe이 컨테이너 크기에 100% 맞게 채워지도록 설정 */
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
  <div class="bg-glow-3"></div>

  <!-- 1. 최상단 menu.html -->
  <object class="content-item menu-container" type="text/html" data="../menu.html"></object>

  <!-- 2. 이미지 -->
  <div class="content-item">
    <img src="https://lh3.googleusercontent.com/d/1HYFJ7nqYfZ5Z1mZueKZ909Hatg4ffUsQ" alt="폰예시 이미지" class="main-image">
  </div>
  
  <!-- 유튜브 영상 -->
  <div class="video-container">
    <iframe 
      src="https://www.youtube.com/embed/zcoKhbR9tzU" 
      title="YouTube video player" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
      allowfullscreen>
    </iframe>
  </div>
  
  <!-- 3. 텍스트 -->
  <div class="content-item">
    <h2>mp4파일이며 다운로드하여 배경화면으로 지정하셔서 쓰시면 됩니다.</h2>
    <h2>스마트폰에서 어떻게 보일지는 예시 이미지를 참고하세요.  </h2>
  </div>

  <!-- 4. 링크 주소 -->
  <div class="content-item">
    <a href="https://drive.google.com/file/d/1gLwHNA3o86YELRtq3FSeaJHrXK3T-mJZ/view?usp=drive_link" target="_blank">라이브배경화면 다운로드</a>
  </div>

  <!-- 5. 이미지 버튼 -->
  <div class="content-item">
    <button type="button" class="img-button" onclick="alert('버튼이 클릭되었습니다!')">
      <img src="https://via.placeholder.com/150x50?text=Button" alt="버튼 이미지">
    </button>
  </div>

</body>
</html>
