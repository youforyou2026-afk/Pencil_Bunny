<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중앙 정렬 레이아웃</title>
  <link rel="stylesheet" href="../common.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      margin: 0; 
      padding: 0px; 
      display: flex; 
      flex-direction: column; 
      align-items: center;    
      text-align: center;     
      font-family: sans-serif; 
    }
    
    /* 메뉴 영역 */
    .menu-container { width: 100%; height: 60px; border: none; }

    /* 전체 콘텐츠를 감싸는 반투명 라운드 패널 */
    .panel {
      background-color: rgba(200, 190, 216, 0.3); /* #c8bed8 색상 + 50% 반투명 */
      backdrop-filter: blur(10px);               /* 뒤 배경 흐림 효과 */
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;                       /* 모서리 라운딩 */
      border: 1px solid rgba(255, 255, 255, 0.4); /* 미세한 흰색 테두리 */
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);  /*은은한 그림자 */
      padding: 30px 20px;                        /* 패널 안쪽 여백 */
      margin: 20px auto 40px auto;               /* 외부 간격 및 중앙 정렬 */
      width: 90%;
      max-width: 1000px;                          /* 패널의 최대 너비 */
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    /* 각 요소 사이의 간격 설정 */
    .content-item { margin-bottom: 20px; }
    
    /* 폰예시 이미지 크기 조절 */
    .main-image { max-width: 90%; height: auto; }
    
    /* 이미지 버튼 스타일링 */
    .img-button { background: none; border: none; padding: 0; cursor: pointer; }
    .img-button img { display: block; max-width: 200px; height: auto; }
    
    /* 비디오 컨테이너 (9:16 비율 유지) */
    .video-container { 
      position: relative; 
      width: 90%; 
      max-width: 400px; 
      aspect-ratio: 9 / 16; 
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); 
      border-radius: 10px; 
      overflow: hidden; 
      background-color: #000; 
      margin-bottom: 20px; 
    }
    
    /* iframe을 컨테이너 크기에 맞춤 */
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

    /* 모바일 반응형 */
    @media (max-width: 600px) {
      .panel {
        width: 92%;
        padding: 20px 15px; /* 모바일에서는 패널 내부 여백 축소 */
      }
      .video-container {
        max-width: 80%;
        margin-left: auto;
        margin-right: auto;
      }
      .main-image {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
  <div class="bg-glow-3"></div>
  
  <!-- 1. 최상단 menu.html (상단 고정/메인 영역 밖) -->
  <object class="content-item menu-container" type="text/html" data="../menu.html"></object>
  
  <!-- 반투명 라운드 패널 시작 -->
  <div class="panel">
    
    <!-- 유튜브 영상 -->
    <div class="video-container content-item">
      <iframe src="https://www.youtube.com/embed/zcoKhbR9tzU" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen>
      </iframe>
    </div>
    
    <!-- 이미지 -->
    <div class="content-item">
      <img src="https://lh3.googleusercontent.com/d/1HYFJ7nqYfZ5Z1mZueKZ909Hatg4ffUsQ" alt="폰예시 이미지" class="main-image">
    </div>
    
    <!-- 텍스트 -->
    <div class="content-item">
      <h2>무료 라이브 배경화면 입니다.</h2>
      <h2>mp4파일이며 다운로드하여 배경화면으로 지정하여 쓰시면 됩니다.</h2>
      <h2>스마트폰에서 어떻게 보일지는 예시 이미지를 참고하세요.</h2>
    </div>
    
    <!-- 다운로드 링크 -->
    <div class="content-item">
      <h1><a href="https://drive.google.com/file/d/1gLwHNA3o86YELRtq3FSeaJHrXK3T-mJZ/view?usp=drive_link" target="_blank">라이브배경화면 다운로드</a></h1>
    </div>
    
    <!-- 이미지 버튼 -->
    <div class="content-item" style="margin-bottom: 0;">
      <button type="button" class="img-button" onclick="alert('버튼이 클릭되었습니다!')">
        <img src="https://via.placeholder.com/150x50?text=Button" alt="버튼 이미지">
      </button>
    </div>

  </div>
  <!-- 반투명 라운드 패널 끝 -->

</body>
</html>
