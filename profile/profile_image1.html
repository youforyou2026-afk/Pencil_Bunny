<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중앙 정렬 레이아웃</title>
  <link rel="stylesheet" href="../common.css">
  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
    body {
      margin: 0;
      padding: 0px;
      display: flex;
      flex-direction: column; /* 요소들을 세로로 배치 */
      align-items: center;    /* 가로 방향 중앙 정렬 */
      text-align: center;     /* 텍스트 중앙 정렬 */
      font-family: sans-serif;
    }

    /* 각 요소 사이의 간격 설정 */
    .content-item {
      margin-bottom: 20px;
    }

    /* 메뉴 영역 (menu.html 불러오기) */
    .menu-container {
      width: 100%;
      height: 60px; /* menu.html의 높이에 맞게 조절하세요 */
      border: none;
    }

    /* 이미지 크기 조절 */
    .main-image {
      max-width: 50%;
      height: auto;
    }

    /* 이미지 버튼 스타일링 */
    .img-button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .img-button img {
      display: block;
      max-width: 200px; /* 버튼 이미지 크기에 맞춰 조절하세요 */
      height: auto;
    }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
  <div class="bg-glow-3"></div>

  <!-- 1. 최상단 menu.html -->
  <object class="content-item menu-container" type="text/html" data="../menu.html"></object>

  <!-- 2. 이미지 -->
  <div class="content-item">
    <img src="https://lh3.googleusercontent.com/d/19BZSpUi7vtCPgQ0oAfKgwaA7uwGt8ip8" alt="메인 이미지" class="main-image">
  </div>
  
  <!-- 유튜브 영상 -->
  <div class="video-container">
    <iframe 
      src="https://youtube.com/shorts/zcoKhbR9tzU" 
      title="YouTube video player" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
      allowfullscreen>
    </iframe>
  </div>
  
  <!-- 3. 텍스트 -->
  <div class="content-item">
    <h2>여기에 제목이나 설명을 입력하세요</h2>
    <p>중앙에 정렬된 본문 텍스트입니다.</p>
  </div>

  <!-- 4. 링크 주소 -->
  <div class="content-item">
    <a href="https://drive.google.com/file/d/1gLwHNA3o86YELRtq3FSeaJHrXK3T-mJZ/view?usp=drive_link" target="_blank">라이브배경화면 다운로드</a>
  </div>

  <!-- 5. 이미지 버튼 -->
  <div class="content-item">
    <button type="button" class="img-button" onclick="alert('버튼이 클릭되었습니다!')">
      <img src="https://via.placeholder.com/150x50?text=Button" alt="버튼 이미지">
    </button>
  </div>

</body>
</html>
