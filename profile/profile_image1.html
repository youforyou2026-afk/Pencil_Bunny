<style>
  /* 카드 컨테이너 정렬 */
  .card {
    display: flex;
    flex-direction: column; /* 세로 방향 정렬 */
    align-items: center;    /* 자식 요소(이미지, 버튼 등) 가로 중앙 정렬 */
    justify-content: center;
    text-align: center;     /* 텍스트 내용 중앙 정렬 */
  }

  /* 텍스트 요소 여백 조정 (선택 사항) */
  .card-description,
  .card-link {
    margin: 8px 0;
  }

  /* 이미지 및 이미지 버튼 중앙 배치 보장 */
  .card-image,
  .image-button-link {
    display: block;
    margin: 0 auto;
  }
</style>

<div class="card">
  <!-- 1. 이미지 -->
  <img src="https://via.placeholder.com/400x200" alt="대표 이미지" class="card-image">

  <!-- 2. 설명 텍스트 -->
  <p class="card-description">
    여기에 상세한 설명 텍스트를 입력하세요.
  </p>

  <!-- 3. 링크 주소 -->
  <p class="card-link">
    <a href="https://example.com" target="_blank" rel="noopener noreferrer">
      https://example.com
    </a>
  </p>

  <!-- 4. 다른 HTML을 불러오는 이미지 버튼 -->
  <a href="other_page.html" class="image-button-link">
    <img src="https://via.placeholder.com/150x50?text=페이지+이동" alt="다른 페이지로 이동">
  </a>
</div>
