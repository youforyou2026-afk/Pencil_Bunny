<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3x5 이미지 갤러리</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f0f0f0;
  }

  /* 갤러리 */
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    padding: 20px;
    max-width: 1200px;
    margin: auto;
  }
  .gallery img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .gallery img:hover {
    transform: scale(1.05);
  }

  /* 팝업 */
  .popup {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }
  .popup-content {
    position: relative;
    max-width: 80%;
    max-height: 80%;
  }
  .popup-content img {
    width: 100%;
    height: auto;
    border-radius: 8px;
  }

  /* 버튼 */
  .close, .prev, .next {
    position: absolute;
    color: white;
    font-size: 2rem;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
  }
  .close {
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
  }
  .prev {
    top: 50%;
    left: -50px;
    transform: translateY(-50%);
  }
  .next {
    top: 50%;
    right: -50px;
    transform: translateY(-50%);
  }
</style>
</head>
<body>

<!-- 갤러리 -->
<div class="gallery">
  <img src="https://drive.google.com/file/d/1o9pCrJpfnC6jm2E2X8-Mu5SqpnDsOQlT/view?usp=sharing" alt="이미지 1">
  <img src="img2.jpg" alt="이미지 2">
  <img src="img3.jpg" alt="이미지 3">
  <img src="img4.jpg" alt="이미지 4">
  <img src="img5.jpg" alt="이미지 5">
  <img src="img6.jpg" alt="이미지 6">
  <img src="img7.jpg" alt="이미지 7">
  <img src="img8.jpg" alt="이미지 8">
  <img src="img9.jpg" alt="이미지 9">
  <img src="img10.jpg" alt="이미지 10">
  <img src="img11.jpg" alt="이미지 11">
  <img src="img12.jpg" alt="이미지 12">
  <img src="img13.jpg" alt="이미지 13">
  <img src="img14.jpg" alt="이미지 14">
  <img src="img15.jpg" alt="이미지 15">
</div>

<!-- 팝업 -->
<div class="popup" id="popup">
  <div class="popup-content">
    <span class="prev" id="prev">&#10094;</span>
    <span class="next" id="next">&#10095;</span>
    <img id="popup-img" src="" alt="팝업 이미지">
    <span class="close" id="close">x</span>
  </div>
</div>

<script>
  const galleryImages = document.querySelectorAll('.gallery img');
  const popup = document.getElementById('popup');
  const popupImg = document.getElementById('popup-img');
  const closeBtn = document.getElementById('close');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');

  let currentIndex = 0;

  // 이미지 클릭 시 팝업 열기
  galleryImages.forEach((img, index) => {
    img.addEventListener('click', () => {
      currentIndex = index;
      showImage();
      popup.style.display = 'flex';
    });
  });

  // 팝업 닫기
  closeBtn.addEventListener('click', () => {
    popup.style.display = 'none';
  });

  // 이전 이미지
  prevBtn.addEventListener('click', () => {
    currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
    showImage();
  });

  // 다음 이미지
  nextBtn.addEventListener('click', () => {
    currentIndex = (currentIndex + 1) % galleryImages.length;
    showImage();
  });

  function showImage() {
    popupImg.src = galleryImages[currentIndex].src;
  }
</script>

</body>
</html>
