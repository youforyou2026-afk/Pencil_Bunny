<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3x5 이미지 갤러리</title>
<style>
  body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 0vh;
      margin: 0;
      background-color: #ffffff;
  }

  /* 타이틀 */
  .title {
    margin-bottom: 30px;
    text-align: center;
  }
  .title img {
    width: 90%;
    max-width: 1500px;
    height: auto;
    border-radius: 10px;
  }

  /* 갤러리 */
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    padding: 5px;
    max-width: 1200px;
    margin: auto;
  }
  .gallery img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .gallery img:hover {
    transform: scale(1.05);
  }

  /* 팝업 오버레이 */
  .popup {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }

  /* 팝업 내부 컨테이너 */
  .popup-content {
    position: relative;
    width: 100%;
    max-width: 90%;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 세로 스크롤 영역 */
  .img-wrapper {
    width: 100%;
    max-height: 100%;
    overflow-y: auto;
    border-radius: 8px;
    position: relative;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.5) transparent;
  }

  .img-wrapper img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* 버튼 공통 스타일 */
  .close, .prev, .next {
    position: absolute;
    color: white;
    font-size: 1.5rem;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    z-index: 1010;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    transition: background 0.2s;
  }

  .close:hover, .prev:hover, .next:hover {
    background: rgba(0, 0, 0, 0.8);
  }

  /* PC 기본 닫기 버튼: 이미지 상단 중앙 내부 배치 (기존 유지) */
  .close {
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 40px;
    line-height: 1;
  }

  /* 이전/다음 버튼: 동일한 크기(45x45) 및 배치 */
  .prev, .next {
    top: 50%;
    transform: translateY(-50%);
    width: 45px;
    height: 45px;
  }

  .prev {
    left: 15px;
  }

  .next {
    right: 15px;
  }

  /* ==========================================
     모바일 전용 스타일 (화면 너비 768px 이하)
     ========================================== */
  @media (max-width: 768px) {
    /* 모바일 닫기 버튼: 이미지를 가리지 않도록 상단 바깥으로 위치 이동 */
    .close {
      top: -50px; /* 이미지 영역 상단 위쪽으로 이동 */
    }

    /* 이미지와 닫기 버튼 간 여백 확보를 위한 상단 여백 설정 */
    .popup-content {
      margin-top: 40px;
    }
  }
</style>
</head>
<body>

<div class="title">
  <img src="https://lh3.googleusercontent.com/d/1sRpAWUu_gv5Fh6TNP-N9c8knspprpB6O" alt="타이틀 이미지">
</div>

<div class="gallery">
  <img src="https://lh3.googleusercontent.com/d/1o9pCrJpfnC6jm2E2X8-Mu5SqpnDsOQlT" alt="이미지 1">
  <img src="https://lh3.googleusercontent.com/d/1GKnkSKGFVkUocBpYVkQToe_95fWlKHFN" alt="이미지 2">
  <img src="https://lh3.googleusercontent.com/d/1tqIaUAd5TcwjXIo46CamuaT7VaRPgb1Y" alt="이미지 3">
  <img src="https://lh3.googleusercontent.com/d/1HBgkU_J_DSG30m23et7RSA7sfO52i6Wb" alt="이미지 4">
  <img src="https://lh3.googleusercontent.com/d/1KS_vYMDDqtrPumntAzi0yyHpFF1MAe5b" alt="이미지 5">
  <img src="https://lh3.googleusercontent.com/d/1dJe_tKXWfDQ_ORUNOenDH_E0AMf1E9fO" alt="이미지 6">
  <img src="https://lh3.googleusercontent.com/d/1m75RB73m6h7sDnZn6MHye1r2uGZMmK3T" alt="이미지 7">
  <img src="https://lh3.googleusercontent.com/d/1x9HkOjOWVyubxhw8b6Jqw7aWqbL68_nQ" alt="이미지 8">
  <img src="https://lh3.googleusercontent.com/d/1WGpv-lY2Ye5vBOT_sxI2MRMwVPaxNErK" alt="이미지 9">
  <img src="https://lh3.googleusercontent.com/d/1qwrnTvVi7L74aNb73rIBL7X2_4UzR7FS" alt="이미지 10">
  <img src="https://lh3.googleusercontent.com/d/1ar6KfuHRep0bB26W2uCP9Eejm04saes9" alt="이미지 11">
  <img src="https://lh3.googleusercontent.com/d/1tW0K-CtVRfE0okFGyjO3-jKLvRNb2OiZ" alt="이미지 12">
  <img src="https://lh3.googleusercontent.com/d/1DcwIvzavPWd6_td3eJRNaOah4vDDjEJB" alt="이미지 13">
  <img src="https://lh3.googleusercontent.com/d/1mToRLuhOAlgkt_UUoHnnHa1epqFnf7AA" alt="이미지 14">
  <img src="https://lh3.googleusercontent.com/d/1j7o86d63rmPiMbxmryY3HrdKGnG-FnoL" alt="이미지 15">
</div>

<div class="popup" id="popup">
  <div class="popup-content">
    <span class="close" id="close">x</span>
    <span class="prev" id="prev">❮</span>
    <span class="next" id="next">❯</span>
    <div class="img-wrapper" id="img-wrapper">
      <img id="popup-img" src="" alt="팝업 이미지">
    </div>
  </div>
</div>

<script>
  const galleryImages = document.querySelectorAll('.gallery img');
  const popup = document.getElementById('popup');
  const popupImg = document.getElementById('popup-img');
  const imgWrapper = document.getElementById('img-wrapper');
  const closeBtn = document.getElementById('close');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');

  let currentIndex = 0;

  // 이미지 클릭 시 팝업 열기
  galleryImages.forEach((img, index) => {
    img.addEventListener('click', () => {
      currentIndex = index;
      showImage();
      popup.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    });
  });

  // 팝업 닫기
  closeBtn.addEventListener('click', closePopup);

  // 이전/다음 버튼
  prevBtn.addEventListener('click', () => {
    currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
    showImage();
  });

  nextBtn.addEventListener('click', () => {
    currentIndex = (currentIndex + 1) % galleryImages.length;
    showImage();
  });

  function showImage() {
    popupImg.src = galleryImages[currentIndex].src;
    imgWrapper.scrollTop = 0;
  }

  function closePopup() {
    popup.style.display = 'none';
    document.body.style.overflow = 'auto';
  }
</script>

</body>
</html>
